# Локальные хуки. Устанавливаются один раз:
#   python -m pip install pre-commit && pre-commit install
#
# Хактон завершён, нового кода в репо не будет — хуки нужны только чтобы
# не заносить в коммит мусор при разборе архива.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^archive/
      - id: end-of-file-fixer
        exclude: ^archive/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^src/
      # ruff-format намеренно не включён: код заморожен, массовое
      # переформатирование даёт шум в диффе без практической пользы.
